# Posts queued Instagram Reels (draft releases of this repo) at the channel's slots.
# Managed by the Entertainer app (python -m entertainer instagram setup) - edit there, not here.
# Slots (IST): Mon-Fri 8:00 AM + 8:30 PM, Sat/Sun 10:30 AM + 6:30 PM. GitHub cron is best-effort (on 2026-11-24 both
# the slot run and its catch-up were silently dropped), so this checks the queue every 15 minutes: each run posts
# anything due within LEAD_MIN (uploads early, waits for the slot) or overdue. Idle runs take ~15 s (free: public repo).
name: post-reels
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check the token and list the queue (post nothing)"
        type: boolean
        default: false
concurrency:
  group: post-reels
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Post due reels
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          LEAD_MIN: "20"
        run: python3 post_reels.py
