# Posts queued Instagram Reels (draft releases of this repo) at the channel's slots.
# Managed by the Entertainer app (python -m entertainer instagram setup) - edit there, not here.
# Slots (IST): Mon-Fri 8:00 AM + 8:30 PM, Sat/Sun 10:30 AM + 6:30 PM. GitHub's cron never fired for this repo
# (2026-11-24), so each run is a RELAY: it stays alive ~5 h posting reels as they come due (upload 20 min early, publish
# at the slot), then dispatches the next run of itself (workflow_dispatch from GITHUB_TOKEN is allowed to trigger
# runs). The cron below only restarts the chain if it ever breaks. Free: public repo.
name: post-reels
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check the token and list the queue (post nothing)"
        type: boolean
        default: false
concurrency:
  group: post-reels
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Post due reels
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          LEAD_MIN: "20"
          RELAY_HOURS: "5"
        run: python3 post_reels.py
      - name: Start the next relay run
        if: ${{ always() && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run post-reels.yml --repo "$GITHUB_REPOSITORY" --ref main
