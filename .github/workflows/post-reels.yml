# Posts queued Instagram Reels (draft releases of this repo) at the channel's slots.
# Managed by the Entertainer app (python -m entertainer instagram setup) - edit there, not here.
# Slots (IST): Mon-Fri 8:00 AM + 8:30 PM, Sat/Sun 10:30 AM + 6:30 PM. Cron is UTC and starts 20 min early so the
# upload is processed before the slot; a catch-up run 40 min after each slot covers delayed or dropped schedules.
name: post-reels
on:
  schedule:
    - cron: "10 2 * * 1-5"    # 08:00 IST weekdays
    - cron: "40 14 * * 1-5"   # 20:30 IST weekdays
    - cron: "40 4 * * 0,6"    # 10:30 IST weekends
    - cron: "40 12 * * 0,6"   # 18:30 IST weekends
    - cron: "10 3 * * 1-5"    # catch-ups
    - cron: "40 15 * * 1-5"
    - cron: "40 5 * * 0,6"
    - cron: "40 13 * * 0,6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check the token and list the queue (post nothing)"
        type: boolean
        default: false
concurrency:
  group: post-reels
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Post due reels
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          LEAD_MIN: "20"
        run: python3 post_reels.py
